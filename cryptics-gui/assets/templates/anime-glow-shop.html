<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- Skill Made By : Crypticplay_RBLX - Only on Youtube -->
<meta name="author" content="Crypticplay_RBLX">
<title>Shop – Anime Dark</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,600;0,800;1,900&display=swap" rel="stylesheet">
<style>
  /* Anime / dark shop, built from real references (references/reference-first.md): flat dark panels,
     small corners, ONE accent colour (change --accent), dense but ordered information, a slanted title tab,
     the item art is the hero. Glow is used once (the hero buy button) — never neon on every edge.
     Rows come from shop.csv (content.json); empty = text holder. Rarity = colour strip + the word. */
  :root { --accent: #ff3355; --bg: #101219; --panel: #171a23; --panel2: #1e2230; --line: #2b3040; --muted: #8b93a7; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #0b0c10; font-family: 'Montserrat', system-ui, sans-serif; font-weight: 800; color: #fff; }
  .page { display: flex; gap: 40px; padding: 40px; align-items: flex-start; width: max-content; }
  .artboard { position: relative; width: 1280px; height: 800px; overflow: hidden; border-radius: 6px;
    background: linear-gradient(180deg, #3a4660, #1c2130 60%, #151925); }
  .t { paint-order: stroke fill; -webkit-text-stroke: 4px #000; }
  .it { font-style: italic; font-weight: 900; text-transform: uppercase; letter-spacing: .01em; }

  .win { position: absolute; left: 80px; top: 92px; width: 1120px; height: 640px; }
  .panel { position: absolute; left: 0; top: 34px; width: 1120px; height: 606px; background: var(--bg); border: 2px solid var(--line); border-radius: 10px;
    box-shadow: 0 24px 60px rgba(0,0,0,.55); }
  /* slanted title tab breaking out of the top edge */
  .tab-title { position: absolute; left: 28px; top: 0; height: 68px; padding: 0 44px 0 28px; background: var(--accent);
    clip-path: polygon(0 0, 100% 0, calc(100% - 26px) 100%, 0 100%); display: flex; align-items: center; z-index: 3; }
  .tab-title span { font-size: 40px; }
  .tab-title::after { content: ''; position: absolute; left: 0; right: 26px; bottom: 0; height: 6px; background: rgba(0,0,0,.25); }
  .close { position: absolute; right: 16px; top: 50px; width: 46px; height: 46px; border-radius: 8px; background: var(--panel2); border: 2px solid var(--line);
    display: grid; place-items: center; z-index: 3; font-size: 22px; color: var(--muted); }
  .cur { position: absolute; right: 74px; top: 50px; height: 46px; padding: 0 16px 0 52px; border-radius: 8px; background: var(--panel2); border: 2px solid var(--line);
    display: flex; align-items: center; font-size: 20px; z-index: 3; }
  .cur img { position: absolute; left: 6px; top: 50%; width: 40px; height: 40px; transform: translateY(-50%); }

  /* left nav */
  .nav { position: absolute; left: 20px; top: 118px; width: 200px; display: flex; flex-direction: column; gap: 6px; z-index: 2; }
  .nav .i { height: 52px; border-radius: 8px; display: flex; align-items: center; gap: 12px; padding: 0 14px; color: var(--muted); font-size: 16px; text-transform: uppercase; }
  .nav .i img { width: 32px; height: 32px; object-fit: contain; filter: grayscale(.6) brightness(.85); }
  .nav .i.sel { background: var(--panel2); color: #fff; box-shadow: inset 4px 0 0 var(--accent); }
  .nav .i.sel img { filter: none; }

  /* hero banner */
  .hero { position: absolute; left: 236px; top: 118px; width: 864px; height: 220px; border-radius: 10px; overflow: hidden; background: var(--panel);
    border: 2px solid var(--line); z-index: 1; }
  .hero::before { content: ''; position: absolute; inset: 0; background: linear-gradient(90deg, rgba(255,51,85,.28), transparent 55%),
    repeating-linear-gradient(115deg, rgba(255,255,255,.035) 0 2px, transparent 2px 14px); }
  .hero .art { position: absolute; left: 24px; top: 50%; width: 220px; height: 220px; transform: translateY(-50%) rotate(-6deg); object-fit: contain; z-index: 1; }
  .hero .tag { position: absolute; left: 270px; top: 26px; padding: 4px 10px; background: var(--accent); border-radius: 4px; font-size: 13px; font-style: italic; }
  .hero h2 { position: absolute; left: 270px; top: 58px; margin: 0; font-size: 40px; line-height: 1; max-width: 330px; }
  .hero .desc { position: absolute; left: 272px; top: 136px; max-width: 320px; color: #c7cddb; font-weight: 600; font-size: 15px; }
  .hero .timer { position: absolute; left: 272px; bottom: 18px; display: flex; align-items: center; gap: 8px; font-size: 15px; color: var(--muted); }
  .hero .timer img { width: 26px; height: 26px; }
  .hero .timer b { color: #fff; }
  .hero .buy { position: absolute; right: 24px; bottom: 24px; width: 230px; height: 64px; border-radius: 8px; background: var(--accent);
    display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 26px; box-shadow: 0 0 28px rgba(255,51,85,.45), inset 0 -5px 0 rgba(0,0,0,.25); }
  .hero .buy img { width: 34px; height: 34px; }
  .hero .old { position: absolute; right: 268px; bottom: 44px; color: var(--muted); text-decoration: line-through; font-size: 18px; }

  /* item grid: 4 columns, rarity = colour strip + word */
  .grid { position: absolute; left: 236px; top: 354px; width: 864px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; z-index: 1; }
  .card { position: relative; height: 222px; border-radius: 10px; background: var(--panel); border: 2px solid var(--line); overflow: hidden; }
  .card::before { content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 60%; background: linear-gradient(0deg, var(--r, #4c5a78) 0%, transparent 100%); opacity: .35; }
  .card::after { content: ''; position: absolute; left: 0; right: 0; top: 0; height: 4px; background: var(--r, #4c5a78); }
  .card .bdg { position: absolute; right: 8px; top: 12px; padding: 3px 8px; border-radius: 4px; font-size: 11px; background: var(--accent); font-style: italic; z-index: 2; }
  .card img.ic { position: absolute; left: 50%; top: 22px; width: 108px; height: 108px; transform: translateX(-50%); object-fit: contain; z-index: 1; }
  .card .nm { position: absolute; left: 12px; right: 12px; top: 134px; font-size: 16px; text-transform: uppercase; font-style: italic; z-index: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card .pr { position: absolute; left: 10px; right: 10px; bottom: 10px; height: 40px; border-radius: 6px; background: #ffffff14; border: 2px solid var(--line);
    display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 18px; z-index: 1; }
  .card .pr img { width: 26px; height: 26px; }
  .common { --r: #9aa5b4; } .uncommon { --r: #34d058; } .rare { --r: #2f8cff; } .epic { --r: #9b51ff; } .legendary { --r: #ffb21e; } .mythic { --r: #ff3b5c; }

  .legend { width: 300px; background: #11141b; border: 1px solid #2a2f3b; border-radius: 12px; padding: 16px 18px; font-family: system-ui, sans-serif; font-weight: 400; }
  .legend h4 { margin: 0 0 8px; font: 800 16px 'Montserrat', sans-serif; }
  .legend li { margin: 5px 0; color: #c9cfdb; font-size: 13px; }
</style>
</head>
<body>
<div class="page">
  <div class="artboard" id="artboard">
    <div class="win" data-origin>
      <div class="panel" data-piece="panel"></div>
      <div class="tab-title" data-piece="title_tab"><span class="it" data-bind="text.title_shop" data-ph="TITLE"></span></div>
      <div class="cur" data-piece="cur"><img data-bind="currencies.gems.icon" alt=""><span data-bind="currencies.gems.amount" data-format="abbrev" data-ph="GEMS"></span></div>
      <div class="close" data-piece="close">✕</div>

      <div class="nav">
        <div class="i sel" data-piece="nav_sel"><img src="assets/icons/star.png" alt=""><span data-bind="text.tab_featured" data-ph="FEATURED"></span></div>
        <div class="i" data-piece="nav"><img src="assets/icons/sword.png" alt=""><span data-bind="text.tab_units" data-ph="TAB"></span></div>
        <div class="i"><img src="assets/icons/potion.png" alt=""><span data-bind="text.tab_boosts" data-ph="TAB"></span></div>
        <div class="i"><img src="assets/icons/robux.png" alt=""><span data-bind="text.tab_robux" data-ph="TAB"></span></div>
      </div>

      <div class="hero" data-piece="hero">
        <img class="art" data-bind="shop.0.icon" alt="">
        <div class="tag" data-bind="shop.0.badge" data-ph="BADGE"></div>
        <h2 class="it" data-bind="shop.0.name" data-ph="FEATURED ITEM"></h2>
        <div class="desc" data-bind="shop.0.description" data-ph="DESCRIPTION"></div>
        <div class="timer"><img src="assets/icons/clock.png" alt=""><b data-bind="shop.0.ends_in_seconds" data-format="time" data-ph="TIME LEFT"></b></div>
        <div class="old" data-bind="shop.0.old_price" data-format="commas" data-ph="OLD PRICE"></div>
        <div class="buy it" data-piece="buy"><img src="assets/icons/robux.png" alt=""><span data-bind="shop.0.price" data-format="commas" data-ph="PRICE"></span></div>
      </div>

      <div class="grid">
        <div class="card" data-repeat="shop" data-where="section=passes" data-count="4" data-class="rarity" data-piece="card">
          <span class="bdg" data-field="badge" data-if="badge"></span>
          <img class="ic" data-src="icon" alt="">
          <div class="nm" data-field="name" data-ph="ITEM NAME"></div>
          <div class="pr"><img src="assets/icons/robux.png" alt=""><span data-field="price" data-format="commas" data-ph="PRICE"></span></div>
        </div>
      </div>
    </div>
  </div>

  <div class="legend">
    <h4>Notes</h4>
    <ul>
      <li>Hero = first row of shop.csv; grid = rows with section "passes" (4 slots, empty = text holders).</li>
      <li>One accent colour (--accent). Rarity shows as the top strip + glow from the bottom.</li>
      <li>FX: only the hero BUY gets Glow + Shine. Everything else: Bounce + ui_click.</li>
    </ul>
  </div>
</div>
<script src="content.js"></script>
<script src="export.js"></script>
</body>
</html>
